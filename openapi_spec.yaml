      description: >-
        ## GET Social Hub Challenges


        Retrieves a list of **Social Hub challenges** from the Kickbase fantasy
        football platform. Social Hub challenges are community-based challenges
        that players can participate in within the game.


        ---


        ### Authentication


        This endpoint requires a valid bearer token. Include the token in the
        `Authorization` header:


        ```

        Authorization: Bearer {{token}}

        ```


        ---


        ### Query Parameters


        | Parameter | Type    | Required |
        Description                                              |

        |-----------|---------|----------|----------------------------------------------------------|

        | `start`   | integer | No       | Pagination offset — the index of the
        first result to return. Defaults to `0` if omitted. |

        | `max`     | integer | No       | Maximum number of results to return
        per page. Use in combination with `start` for pagination. |


        ---


        ### Headers


        | Header   | Value              |

        |----------|--------------------|

        | `Accept` | `application/json` |


        ---


        ### Example Request


        ```

        GET {{baseUrl}}/v4/challenges/socialhub?start=0&max=20

        ```


        ---


        ### Response


        Returns a JSON object containing the list of Social Hub challenges. Use
        the `start` and `max` parameters to paginate through large result sets.
