        Refreshes the authentication token used specifically for the **Kickbase
        chat service**. This endpoint is distinct from the general user token
        refresh (`POST /v4/user/refreshtokens`) — it is scoped to the real-time
        chat subsystem and returns a short-lived token that authorises the
        client to connect to or continue a chat session.


        ### Authentication


        Requires a valid Bearer token in the `Authorization` header (inherited
        from the collection-level auth):


        ```

        Authorization: Bearer {{token}}

        ```


        The `{{token}}` variable is set in the **Kickbase v4** environment after
        a successful login via `POST /v4/user/login`.


        ### Request


        | Property | Value |

        |---|---|

        | Method | `GET` |

        | URL | `{{baseUrl}}/v4/chat/refreshtoken` |

        | Base URL | `https://api.kickbase.com` |


        No request body or query parameters are required.


        ### Response


