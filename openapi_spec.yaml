      description: >-
        ## Search Social Hub Challenges


        Search for public Social Hub challenges available on the Kickbase
        platform. This endpoint allows you to find challenges by keyword and
        supports pagination through the results.


        ---


        ### Authentication


        This request inherits **Bearer Token** authentication from the
        collection. The `{{token}}` variable must be set in your active
        environment with a valid access token obtained after login.


        ```

        Authorization: Bearer {{token}}

         ```

        ---


        ### Headers


        | Key | Value | Description |

        | --- | --- | --- |

        | `Accept` | `application/json` | Specifies that the response should be
        returned as JSON. |


        ---


        ### Query Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `start` | integer | No | The zero-based offset for pagination. Use
        this to skip a number of results and retrieve the next page. |

        | `max` | integer | No | The maximum number of results to return per
        page. |

        | `query` | string | No | A search keyword to filter challenges by name
        or other relevant fields. Leave empty to retrieve all available
        challenges. |


        ---


        ### Example Response


        A successful `200 OK` response returns a list of matching Social Hub
        challenges:


        ``` json

        {
            "it": [
                {
                    "ui": "123",
                    "unm": "abc",
                    "dvim": "content/file/123abc.png",
                    "uim": "user/123abc.jpeg",
                    "ipic": true
                }
            ]
        }

         ```

        | Field | Description |

        | --- | --- |

        | `it` | Array of challenge/user result items. |

        | `ui` | User/challenge identifier. |

        | `unm` | Username or challenge name. |

        | `dvim` | Default/cover image path. |

        | `uim` | User profile image path. |

        | `ipic` | Boolean indicating whether a profile picture is set. |
