      description: >-
        ## Get Player Market Value History


        Retrieves the market value history for a specific player within a league
        over a given timeframe. This endpoint returns a time-series of market
        value entries along with summary statistics such as the lowest and
        highest market values recorded during the period.


        ---


        ### Path Parameters


        | Parameter | Type | Description |

        | --- | --- | --- |

        | `leagueId` | string | The unique identifier of the league. Uses the
        `{{leagueId}}` variable. |

        | `playerId` | string | The unique identifier of the player. Uses the
        `{{playerId}}` variable. |

        | `timeframe` | integer | The timeframe (in days) for which to retrieve
        market value history. Right now you can choose between `92` (approx. 3
        months) and `365` (1 year). |


        ---


        ### Headers


        | Key | Value | Description |

        | --- | --- | --- |

        | `Accept` | `application/json` | Specifies that the response should be
        in JSON format. |


        ---


        ### Response (200 OK)


        | Field | Type | Description |

        | --- | --- | --- |

        | `it` | array | Array of market value entries over the timeframe. Each
        entry contains: `dt` (date as an integer, e.g. matchday or timestamp
        index) and `mv` (market value in the currency unit, e.g. euros). |

        | `lmv` | number | **Lowest market value** recorded during the
        timeframe. |

        | `hmv` | number | **Highest market value** recorded during the
        timeframe. |

        | `trp` | number | Total rise points — cumulative upward movement in
        market value. |

        | `prlo` | number | Previous low — the prior lowest market value
        reference point. |

        | `idp` | boolean | Indicates whether the player is in a drop phase
        (`true`) or not (`false`). |

        | `sprmv` | object | Super market value object containing
        promotional/scalable content links: `url` (redirect URL), `lf`
        (light/standard file path), `durl` (dark/alternate file path). |


        ---


        ### Example Response


        ``` json

        {
          "it": [
            { "dt": 20418, "mv": 500000 },
            { "dt": 20419, "mv": 500000 }
          ],
          "trp": 0,
          "prlo": 0,
          "lmv": 500000,
          "hmv": 500000,
          "idp": false,
          "sprmv": {
            "url": "https://go.kickbase.com/scalable",
            "lf": "content/file/...",
            "durl": "content/file/..."
          }
        }

         ```
    parameters:
      - name: leagueId
        in: path
        required: true
        description: '(Required) '
        schema:
          type: string
        example: '{{leagueId}}'
      - name: playerId
        in: path
        required: true
        description: '(Required) '
        schema:
          type: string
        example: '{{playerId}}'
      - name: timeframe
        in: path
        required: true
        description: (Required) 92 or 365 - 3 Months or 1 Year
        schema:
          type: integer
        example: '92'
