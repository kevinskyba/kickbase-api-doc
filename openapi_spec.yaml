            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            CF-RAY:
              schema:
                type: string
              example: 9d693d3af9c7d81e-TXL
            Cache-Control:
              schema:
                type: string
              example: 'no-store, no-cache'
            Content-Encoding:
              schema:
                type: string
              example: br
            vary:
              schema:
