      description: >-
        ## Get Match Details


        Retrieves detailed information about a specific football match,
        including both teams' lineups, match events (goals, substitutions,
        yellow/red cards), scores, and timing data.


        ---


        ### Authentication


        This request inherits the collection-level Bearer token authentication.
        Ensure the `{{token}}` environment variable is set to a valid access
        token.


        ---


        ### Path Variables


        | Variable | Description |

        | --- | --- |

        | `matchId` | The unique identifier of the match to retrieve details
        for. Corresponds to the `{{matchId}}` environment variable. |


        ---


        ### Response


        A successful request returns **HTTP 200 OK** with a JSON body containing
        the following fields:


        | Field | Type | Description |

        | --- | --- | --- |

        | `t1` | string | ID of team 1 |

        | `t2` | string | ID of team 2 |

        | `t1n` | string | Full name of team 1 |

        | `t2n` | string | Full name of team 2 |

        | `t1sy` | string | Short/symbol name of team 1 |

        | `t2sy` | string | Short/symbol name of team 2 |

        | `t1g` | integer | Goals scored by team 1 |

        | `t2g` | integer | Goals scored by team 2 |

        | `mt` | integer | Match minute at the time of the response |

        | `md` | string (ISO 8601) | Scheduled match date and time (UTC) |

        | `mst` | integer | Match status code (e.g. `2` = finished) |

        | `mtd` | string | Match time display string (e.g. `"90"`) |

        | `il` | boolean | Whether the match is live |

        | `t1lp` | array | Starting lineup players for team 1 |

        | `t1nlp` | array | Non-starting (bench/substitute) players for team 1 |

        | `t2lp` | array | Starting lineup players for team 2 |

        | `t2nlp` | array | Non-starting (bench/substitute) players for team 2 |

        | `ts1` | string (ISO 8601) | Timestamp of the first half kick-off |

        | `ts2` | string (ISO 8601) | Timestamp of the second half kick-off |

        | `events` | array | Chronological list of match events |

        | `t1im` | string | Image path for team 1's badge/logo |

        | `t2im` | string | Image path for team 2's badge/logo |


        #### Player Object (in lineup arrays)


        Each player entry in `t1lp`, `t1nlp`, `t2lp`, and `t2nlp` contains:


        | Field | Type | Description |

        | --- | --- | --- |

        | `i` | integer | Player ID |

        | `n` | string | Player surname |

        | `pos` | integer | Position code (`1` = GK, `2` = DEF, `3` = MID, `4` =
        FWD) |

        | `pim` | string | Path to the player's image |


        #### Event Object (in `events` array)


        | Field | Type | Description |

        | --- | --- | --- |

        | `pi` | string | Player ID involved in the event (`"0"` for match-level
        events) |

        | `pn` | string | Player name |

        | `tid` | string | Team ID (`"0"` for match-level events) |

        | `ke` | integer | Event type code (e.g. `1` = goal, `4` = yellow card,
        `8` = substitution in, `9` = substitution out, `10` = kick-off, `11` =
        half-time, `12` = second half start, `13` = full-time) |

        | `mt` | integer | Match minute the event occurred |

        | `rev` | object | For substitution events — the player being replaced
        (contains `pi`, `pn`, `tid`, `ke`) |

        | `pim` | string | Path to the player's image |
    parameters:
      - name: matchId
        in: path
        required: true
        description: '(Required) '
        schema:
          type: string
        example: '{{matchId}}'
