      description: >-
        ## List Leagues


        Retrieves a paginated list of leagues available to the authenticated
        user. Results can be filtered by search query, competition, and gameplay
        mode.


        ---


        ## Query Parameters


        | Parameter | Type | Description |

        | --- | --- | --- |

        | `query` | string | Optional search string to filter leagues by name. |

        | `competitionId` | string | Filter leagues by a specific competition ID
        (e.g. `1` for Kickbase, `3` for LaLiga). |

        | `gameplayMode` | string | Filter leagues by gameplay mode. |

        | `start` | integer | Pagination offset — the index of the first result
        to return. |

        | `max` | integer | Maximum number of results to return per page. |


        ---


