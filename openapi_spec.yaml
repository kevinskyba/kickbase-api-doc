                type: string
              example: DYNAMIC
            Server:
              schema:
                type: string
              example: cloudflare
      tags:
        - v4
        - challenges
        - lobby
        - archive
      description: >-
        ## GET /v4/challenges/lobby/archive


        Retrieves a list of **archived (past) lobby challenges**. This endpoint
        returns previously completed challenge seasons and their associated
        matchday challenges, grouped by season and calendar week.


        ### Response Structure


        The response contains a top-level `it` array, where each entry
        represents a **season group** with the following fields:


        | Field | Description |

        |-------|-------------|

        | `wn` | Calendar week number |

        | `csy` | Challenge season year (e.g. `"2025"`) |

        | `it` | Array of individual challenges within this season/week |


        Each challenge object inside `it` includes:


        | Field | Description |

        |-------|-------------|

        | `ch` | Challenge ID |

        | `chn` | Challenge name (e.g. `"Bundesliga Matchday Challenge #24"`) |

        | `chim` | Challenge image path |

        | `col` | Accent color (hex) associated with the challenge |

        | `p` | Points scored |

        | `top` | Top percentile rank achieved |

        | `skp` | Score/points delta (can be negative) |

        | `sid` | Season ID |

        | `day` | Matchday number |

        | `li` | League instance ID |

        | `cpi` | Challenge participation ID |

        | `cht` | Challenge type |

        | `clpc` | Challenge leaderboard position count |

        | `ispd` | Whether the challenge is paid/premium (`boolean`) |


        ### Notes

        - Requires a valid `token` in the active environment for authentication.

        - Results are ordered by season and week, making it useful for reviewing
        historical challenge performance.
