      tags:
        - v4
        - user
        - password
      description: >-
        ## Change User Password


        Updates the authenticated user's password. This endpoint requires the
        user's current password for verification before setting a new one.


        ### Authentication


        This request requires a valid bearer token passed via the `token`
        variable (set in your environment).


        ### Request Body


        The request body must be sent as JSON (`Content-Type:
        application/json`).


        | Field   | Type   | Required | Description                        |

        |---------|--------|----------|------------------------------------|

        | `pass`  | string | ✅ Yes   | The user's **current** password.   |

        | `npass` | string | ✅ Yes   | The desired **new** password.      |


        **Example:**

        ```json

        {
          "pass": "old-password",
          "npass": "new-password"
        }

        ```


        ### Notes


        - Both fields are required. Omitting either will result in an error
        response.

        - The `pass` field must match the user's existing password; an incorrect
        value will be rejected.

        - Make sure `{{baseUrl}}` and `{{token}}` are set in your active
        environment (e.g. **Kickbase v4**) before sending this request.

        - On success, the password is updated immediately. Subsequent requests
        must use the new password for authentication.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                npass:
                  type: string
                pass:
                  type: string
            example:
              npass: new-password
              pass: old-password
