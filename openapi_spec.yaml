        - login
      description: >-
        # User Login


        This endpoint authenticates a user and returns an access token for
        subsequent API requests.


        ## Overview


        The login endpoint validates user credentials (email and password) and
        returns an authentication token upon successful authentication. This
        token should be used in the `Authorization` header for all authenticated
        API requests.


        ## Request Body Parameters


        The request accepts a JSON payload with the following parameters:


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `em` | string | Yes | User's email address |

        | `pass` | string | Yes | User's password |


        ### Example Request Body


        ``` json

        {
          "em": "user@example.com",
          "pass": "your_password"
        }

         ```

        ## Response Codes


        ### 200 OK


        Successful authentication. Returns user data and authentication token.


        **Response Structure:**


        ``` json

        {
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
          "user": {
            "id": "user_id",
            "email": "user@example.com",
            ...
          }
        }

         ```

        ### 401 Unauthorized


        Authentication failed due to invalid credentials.


        **Response Structure:**


        ``` json

        {
          "err": 1,
          "errMsg": "AccessDenied",
          "svcs": []
        }

         ```

        **Common causes:**


        - Incorrect email address
        
        - Incorrect password
        
        - Account does not exist
        
        - Account may be locked or disabled
        
        
        ## Authentication Flow


        1. **Send Login Request**: POST credentials to `/v4/user/login`
        
        2. **Receive Token**: On success, extract the authentication token from
        the response
        
        3. **Store Token**: Save the token securely (e.g., in an environment
        variable)
        
        4. **Use Token**: Include the token in subsequent API requests using the
        `Authorization` header
        
        
        ## Usage Notes


        - **Token Storage**: Store the returned authentication token in the
        `token` environment variable for reuse across requests
        
        - **Token Expiration**: Tokens may expire after a certain period. If you
        receive 401 errors on authenticated endpoints, re-authenticate to obtain
        a new token
        
        - **Security**: Never commit credentials or tokens to version control.
        Use Postman environment variables to manage sensitive data
        
        - **Rate Limiting**: Multiple failed login attempts may result in
        temporary account lockout
        
        
        ## Variables Used


        This request uses the following environment variables:


        - `baseUrl` - Base API URL
        
        - `email` - User email address
        
        - `password` - User password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pass:
                  type: string
                em:
                  type: string
            example:
              pass: '{{password}}'
              em: '{{email}}'
  /v4/user/password:
    post:
