      description: >-
        ## GET Division Ladder — Challenges Lobby


        Retrieves the **division ladder** for the challenges lobby in Kickbase.
        This endpoint returns the ranked standings of players or teams within
        their respective division, as part of the challenges feature.


        ### Use Case


        Use this endpoint to display the current division rankings in the
        challenges lobby — useful for showing a user's position relative to
        other competitors in their division during an active challenge season.


        ### Authentication


        This request requires a valid bearer token. Set the `token` variable in
        your active environment:


        ```

        Authorization: Bearer {{token}}

        ```


        ### Request


        | Property | Value |

        |----------|-------|

        | Method   | `GET` |

        | URL      | `{{baseUrl}}/v4/challenges/lobby/divisionLadder` |


        **Headers**


        | Key | Value |

        |-----|-------|

        | `Accept` | `application/json` |


        ### Variables


        | Variable | Description |

        |----------|-------------|

        | `baseUrl` | The base URL of the Kickbase API (e.g.
        `https://api.kickbase.com`) |

        | `token`   | A valid authentication token obtained after login |


        ### Response


        Returns a JSON object containing the division ladder, including ranked
        entries with user/team details and their scores or points within the
        current challenge division.


        > See the saved example **"GET /v4/challenges/lobby/divisionLadder"**
        for a sample response.
