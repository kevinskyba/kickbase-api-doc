        ## Forgot Password


        Initiates the forgot password flow for a registered user. When called
        with a valid email address, the server will trigger a password reset
        email to the provided address, allowing the user to regain access to
        their account.


        ### Request Body


        | Parameter | Type | Required | Description |

        |-----------|------|----------|-------------|

        | `em` | string | Yes | The email address associated with the user's
        account (e.g. `name@example.com`) |


        ### Notes


        - The request body must be valid JSON with the `Content-Type:
        application/json` header.

        - A successful response does **not** confirm whether the email address
        exists in the system — this is standard behavior to prevent user
        enumeration.

        - The user will receive a password reset link or code via email if the
        address is registered.

        - Ensure the `Accept: application/json` header is included to receive a
        JSON-formatted response.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                em:
                  type: string
                  format: email
