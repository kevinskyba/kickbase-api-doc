      description: >-
        Returns the master list of all possible live match event types used
        throughout the Kickbase scoring system. This is a reference/lookup
        endpoint — the data changes infrequently and is typically cached.


        ## Authentication

        Requires a valid bearer token passed via the `Authorization` header
        (inherited from the collection).


        ## Response


        **200 OK**


        ```json

        {
          "lcud": "2026-03-02T12:52:39Z",
          "it": [
            {
              "i": 1,
              "ti": "Goal (Striker)"
            }
          ]
        }

        ```


        | Field | Type | Description |

        |-------|------|-------------|

        | `lcud` | string (ISO 8601) | Timestamp of the last cache update for
        this data. |

        | `it` | array | List of event type objects. |

        | `it[].i` | integer | Unique event type ID. |

        | `it[].ti` | string | Human-readable event type title (e.g. `"Goal
        (Striker)"`, `"Yellow Card"`, `"Clean Sheet (GK)"`). |


        ## Event Categories

        The list covers a wide range of event types, including:

        - **Goals** — broken down by player position (striker, midfielder,
        defender, GK)

        - **Assists**

        - **Clean Sheets** — per position

        - **Cards** — yellow, red, second yellow

        - **Penalties** — scored, missed, saved, conceded

        - **Defensive actions** — tackles, interceptions, aerial duels

        - **GK-specific** — saves, goals conceded

        - **Fouls, offsides, crosses, shots**

        - **Bonus & special game mode events** — PlusOne, 3 Play, 1-ON-1,
        Fairplay
