        {
          "rtkn": "cvs78dfzas087t"
        }

        ```


        ### Headers


        | Header | Value |

        |--------|-------|

        | `Content-Type` | `application/json` |

        | `Accept` | `application/json` |


        ### Response


        On success, the response typically contains a new access token (and
        optionally a new refresh token) that can be used for subsequent
        authenticated requests.


        **Example response:**

        ```json

        {
          "token": "<new_access_token>",
          "refreshToken": "<new_refresh_token>"
        }

        ```


