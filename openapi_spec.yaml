      description: >-
        ## Register a New User


        Registers a new user account in the Kickbase platform.


        ---


        ### Endpoint


        ```

        POST {{baseUrl}}/v4/user/register

        ```


        ---


        ### Headers


        | Key | Value |

        |---|---|

        | `Content-Type` | `application/json` |

        | `Accept` | `application/json` |


        ---


        ### Request Body


        Send a raw JSON object with the following fields:


        ```json

        {
          "em": "name@example.com",
          "unm": "username",
          "tkn": "token",
          "pass": "password",
          "rek": false,
          "rept": false,
          "rep": {}
        }

        ```


        #### Fields


        | Field | Type | Description |

        |---|---|---|

        | `em` | `string` | The email address of the user to register. |

        | `unm` | `string` | The desired username for the new account. |

        | `tkn` | `string` | A registration or invite token, if required. |

        | `pass` | `string` | The password for the new account. |

        | `rek` | `boolean` | Whether the user has accepted the terms and
        conditions / privacy policy. |

        | `rept` | `boolean` | Whether the user has opted in to receiving
        push/email notifications. |

        | `rep` | `object` | Additional registration payload or metadata (can be
        an empty object `{}`). |


        ---


        ### Notes


        - All requests must include `Content-Type: application/json` and
        `Accept: application/json` headers.

        - The `tkn` field may be required depending on whether the platform uses
        invite-only registration.

        - Passwords should meet the platform's security requirements before
        being submitted.

        - Use the `{{baseUrl}}` environment variable to target the correct API
        environment (e.g. staging or production).
