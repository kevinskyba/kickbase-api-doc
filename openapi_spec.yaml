        Retrieves the current user's invitation details for a SocialHub
        challenge. This endpoint is used to check whether the authenticated user
        has a pending or active invitation to participate in a SocialHub
        challenge.


        ### Authentication


        This request requires a valid authentication token. Set the `token`
        variable in your active environment before sending.


        ### Request Headers


        | Header | Value |

        |--------|-------|

        | `Accept` | `application/json` |


        ### Path / Variables


        | Variable | Description |

        |----------|-------------|

        | `baseUrl` | The base URL of the Kickbase API (e.g.
        `https://api.kickbase.com`) |


        ### Response


        **200 OK** — Returns the SocialHub challenge invitation details for the
        authenticated user.


        ```json

        {}

        ```


        > **Note:** A `200` response with an empty body (`{}`) may indicate that
        no active invitation exists, or that the invitation data is not yet
        available.
