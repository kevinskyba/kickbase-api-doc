          description: GET /v4/challenges/archive
          headers:
            Date:
              schema:
                type: string
              example: 'Thu, 26 Feb 2026 08:33:27 GMT'
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            CF-RAY:
              schema:
                type: string
              example: 9d3e19043a2c889c-TXL
            cache-control:
              schema:
                type: string
              example: 'no-store, no-cache'
            content-encoding:
              schema:
                type: string
              example: br
            vary:
              schema:
                type: string
              example: Accept-Encoding
            cf-cache-status:
              schema:
                type: string
              example: DYNAMIC
            Server:
              schema:
                type: string
              example: cloudflare
      tags:
        - v4
        - challenges
        - archive
      description: >-
        ## GET /v4/challenges/archive


        Retrieves a list of **archived (past/completed) challenges** from the
        Kickbase API.


        ### Description


        This endpoint returns all challenges that have already ended or been
        completed. Use it to browse historical challenge data, review past
        results, or display a challenge history to users.


        ### Request


        | Property | Value |

        |----------|-------|

        | Method | `GET` |

        | URL | `{{baseUrl}}/v4/challenges/archive` |


        #### Headers


        | Key | Value | Description |

        |-----|-------|-------------|

        | `Accept` | `application/json` | Specifies that the response should be
        returned in JSON format. |


        ### Response


        Returns a JSON object or array containing archived challenge entries.
        Each challenge typically includes details such as the challenge ID,
        name, dates, and final standings or results.


        ### Notes


        - This endpoint only returns **past/completed** challenges. For active
        or upcoming challenges, use the appropriate challenges endpoint.

        - Ensure the `{{baseUrl}}` variable is set correctly in your active
        environment (e.g., `Kickbase v4`).

        - Authentication may be required — make sure the `token` variable is set
        in your environment and passed via the appropriate auth header or
        mechanism.
