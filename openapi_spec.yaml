      description: >-
        Accepts the automated **Kickbase system offer** to sell a player from
        your squad, completing the transfer and removing the player from your
        team.


        > ⚠️ This endpoint accepts the **Kickbase-generated offer** only. To
        accept an offer from another manager, use the [Accept Manager Offer](#)
        endpoint under `/market/{playerId}/offers/{offerId}/accept`. 
        
        
        ---


        ## Path Variables


        | Variable | Description |

        | --- | --- |

        | `leagueId` | The unique ID of the league. |

        | `playerId` | The unique ID of the player being sold. |


        ---


        ## Authentication


        Requires a valid Bearer token passed via the `Authorization` header:


        ```

        Authorization: Bearer {{token}}

         ```

        ---


        ## How It Works


        In Kickbase, when you list a player on the transfer market via `POST
        /v4/leagues/{leagueId}/market/{playerId}/sell`, the Kickbase platform
        may generate an automated offer for that player. This endpoint
        (`DELETE`) is used to **accept that system-generated offer**, finalizing
        the sale.


        There are two types of offers on the Kickbase transfer market:


        1. **Kickbase Offer** — An automated offer generated by the Kickbase
        platform. Accepted via this endpoint.
        
        2. **Manager Offer** — An offer placed by another human manager. Managed
        via the `/market/{playerId}/offers/{offerId}` sub-endpoints.
        
        
        ---


        ## Response


        A successful response indicates the player has been sold and removed
        from your squad. Refer to the API for the exact response schema.
