        The response contains a top-level object with an `it` array, where each
        element represents a league.


        ### Top-level fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `it` | array | List of league objects. |


        ### League object fields (`it[]`)


        | Field | Type | Description |

        | --- | --- | --- |

        | `li` | string | Unique league ID. |

        | `lnm` | string | League name. |

