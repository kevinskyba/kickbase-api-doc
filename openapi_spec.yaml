info:
  title: Kickbase API
  version: 4.5.0
  description: Unofficial Kickbase API Specification
servers:
  - url: 'https://api.kickbase.com'
paths:
  '/v4/challenges/favorites/{favoriteUserId}':
    delete:
      summary: 'DELETE /v4/challenges/favorites/{favoriteUserId}'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
        - v4
        - challenges
        - favorites
        - '{favoriteUserId}'
      description: >-
        # Remove Manager From Favorites


        This endpoint removes a manager from the authenticated user's favorites
        list in the Kickbase challenges system.


        ## Path Parameters


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `favoriteUserId` | integer | Yes | The unique ID of the manager to
        remove from your favorites list |


        **Example:** `1234`


        ## Authentication


        This endpoint requires authentication using a **Bearer Token**. Include
        your access token in the Authorization header:


        ```

        Authorization: Bearer {{token}}

         ```

        The token should be obtained through the authentication flow and stored
        in your environment variables.


        ## Request Headers


        - `Accept: application/json` - Specifies the expected response format
        
        
        ## Responses


        ### Success Response (200 OK)


        The manager has been successfully removed from your favorites list. The
        response will confirm the removal operation.


        ### Error Response (400 Bad Request)


        The request failed due to invalid input. Common causes include:


        - Invalid or non-existent `favoriteUserId`
        
        - Manager is not currently in your favorites list
        
        - Malformed request parameters
        
        
        ## Usage Notes


        - You can only remove managers that are currently in your favorites list
        
        - The `favoriteUserId` must correspond to a valid manager in the system
        
        - This operation is idempotent - attempting to remove a manager that's
        not in your favorites will result in a 400 error
        
        - Ensure your authentication token is valid and has not expired before
        making the request
        
        
        ## Best Practices


        1. **Verify the manager ID** before attempting removal to avoid
        unnecessary error responses
        
        2. **Handle errors gracefully** by checking for 400 status codes and
        providing user-friendly feedback
        
        3. **Refresh your token** if you receive authentication errors
        
        4. **Check your favorites list** after removal to confirm the operation
        succeeded
    parameters:
      - name: favoriteUserId
        in: path
        required: true
        description: '(Required) '
        schema:
          type: integer
        example: '1234'
  /v4/challenges/favorites:
    post:
      summary: POST /v4/challenges/favorites
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
        - v4
        - challenges
        - favorites
      description: >-
        # Add Manager to Favorites


        ## Overview


        This endpoint allows you to add a manager or user to your favorites list
        in the Kickbase application. By marking a manager as a favorite, you can
        quickly access and track their performance throughout the season.


        ## Authentication


        This endpoint requires authentication using a Bearer token. Include your
        access token in the Authorization header:


        ```

        Authorization: Bearer {{token}}

         ```

        The `{{token}}` variable should be set in your environment with a valid
        access token obtained through the Kickbase authentication flow.


        ## Request Body


        The request body must be sent as JSON with the following parameter:


        | Parameter | Type | Required | Description |

        | --- | --- | --- | --- |

        | `ui` | string | Yes | The unique identifier of the user/manager you
        want to add to favorites. This should be a valid user ID from the
        Kickbase system. |


        ### Example Request Body


        ``` json

        {
          "ui": "1234"
        }

         ```

        ## Responses


        ### Success Response (200 OK)


        The manager has been successfully added to your favorites list. See the
        "200" example for the complete response structure.


        ### Error Response (400 Bad Request)


        The request failed due to invalid input or business logic constraints.
        This may occur if:


        - The `ui` parameter is missing or invalid
        
        - The user ID does not exist
        
        - The manager is already in your favorites
        
        - You've reached the maximum number of favorites allowed
        
        
        See the "400" example for the error response structure.


        ## Usage Notes


        - Ensure the user ID (`ui`) corresponds to a valid manager in the
        Kickbase system
        
        - Check your current favorites list before adding to avoid duplicate
        entries
        
        - The endpoint is part of the challenges feature set in Kickbase v4 API
        
        - Rate limiting may apply - refer to the API's general rate limit
        documentation
        
        
        ## Related Endpoints


        You may also want to explore:


        - GET /v4/challenges/favorites - Retrieve your current favorites list
        
        - DELETE /v4/challenges/favorites/{ui} - Remove a manager from favorites
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ui:
                  type: string
                  format: utc-millisec
            example:
              ui: '1234'
  '/v4/challenges/socialhub/{followedUserId}':
    delete:
      summary: 'DELETE /v4/challenges/socialhub/{followedUserId}'
      responses:
        default:
          description: ''
      tags:
        - v4
        - challenges
        - socialhub
        - '{followedUserId}'
      description: >-
        Removes (unfollows) a user from the Social Hub within the challenges
        context. This endpoint deletes the social connection between the
        authenticated user and the specified followed user.


        ## Path Variables


        | Variable | Type | Description |

        |---|---|---|

        | `followedUserId` | string | The unique ID of the user to unfollow.
        Example: `123` |


        ## Headers


        | Key | Value | Description |

        |---|---|---|

        | `Accept` | `application/json` | Specifies that the response should be
        returned in JSON format |


        ## Response


        On success, the server returns a response confirming the user has been
        unfollowed. If the specified `followedUserId` does not exist or the
        authenticated user is not following them, an appropriate error response
        is returned.
    parameters:
      - name: followedUserId
        in: path
        required: true
        description: '(Required) '
        schema:
          type: integer
        example: '123'
