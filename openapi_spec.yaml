        Kickbase, `"3"` = LaLiga). |

        | `mgc` | integer | Current matchday count (number of matchdays played
        so far). |

        | `mgm` | integer | Maximum number of matchdays in the season. |

        | `cpim` | string | Relative path to the competition's image/logo asset.
        |

        | `lim` | string | _(Optional)_ Relative path to the league's custom
        image/logo asset. Only present if a custom league image has been set. |


        ---


