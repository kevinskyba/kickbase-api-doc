        highest/lowest market value, profit/loss, and total return points.


        ---


        ## Path Variables


        | Variable | Description | Example |

        | --- | --- | --- |

        | `leagueId` | The unique identifier of the league the player belongs
        to. | `{{leagueId}}` |

        | `playerId` | The unique identifier of the player whose market value
        data is being requested. | `{{playerId}}` |

        | `timeframe` | The timeframe (in days) over which to retrieve market
        value history. | `92` |


        ---


        ## Request Headers


        | Header | Value | Description |

        | --- | --- | --- |

        | `Accept` | `application/json` | Specifies that the response should be
        returned in JSON format. |


        ---


        ## Response Fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `it` | `array` | Array of market value data points over time. Each
        object contains `dt` (date as an integer) and `mv` (market value at that
        date). |

        | `it[].dt` | `integer` | The date of the data point, represented as a
        numeric value (e.g. day index). |

        | `it[].mv` | `integer` | The player's market value on the corresponding
        date. |

        | `trp` | `integer` | Total return points accumulated by the player. |

        | `prlo` | `integer` | Profit or loss value for the player over the
        given timeframe. |

        | `lmv` | `integer` | The lowest market value recorded within the
        timeframe. |

        | `hmv` | `integer` | The highest market value recorded within the
        timeframe. |

        | `iso` | `boolean` | Indicates whether the player is currently on sale.
        |

        | `idp` | `boolean` | Indicates whether the player is in the default
        position (or a related status flag). |

        | `sprmv` | `object` | Sponsor or promotional market value object,
        likely containing a linked promotion. |

        | `sprmv.url` | `string` | The URL of the sponsor/promotional page. |

        | `sprmv.lf` | `string` | Path to the sponsor's light/foreground image
        file. |

        | `sprmv.durl` | `string` | Path to the sponsor's dark or alternative
        image file. |


        ---


        ## Example Usage


        To fetch the market value history for a player over the last 92 days,
        set the path variables and send the request:


        ```

        GET
        {{baseUrl}}/v4/leagues/{{leagueId}}/players/{{playerId}}/marketvalue/92

        Accept: application/json

         ```

        **Example Response (truncated):**


        ``` json

        {
          "it": [
            { "dt": 20418, "mv": 63966965 },
            { "dt": 20419, "mv": 63980989 }
          ],
          "trp": 59842246,
          "prlo": 5759161,
          "lmv": 63966965,
          "hmv": 65601407,
          "iso": true,
          "idp": false,
          "sprmv": {
            "url": "https://go.kickbase.com/scalable",
            "lf": "content/file/f597374d...",
            "durl": "content/file/d0f8be09..."
          }
        }

         ```

        > **Note:** Ensure that `leagueId` and `playerId` are set in your active
        environment (`Kickbase v4`) before sending the request. The `timeframe`
        value of `92` represents approximately the last 3 months of data.
    parameters:
      - name: leagueId
        in: path
        required: true
        description: '(Required) '
